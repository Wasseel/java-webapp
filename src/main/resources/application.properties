spring.application.name=java-webapp
server.port=8080

# Kubernetes reads these as liveness and readiness probes.
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info

# Finish in-flight requests before exiting, so rolling updates do not
# drop a user's request mid-deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
